server {
    listen 80;
    listen [::]:80;
    server_name senkai.fun;
    root /var/www/senkai.fun/public;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/senkai.fun/acme;
        try_files $uri =404;
    }
    location = /extensions { return 302 /extensions/repo.json; }
    location = /extensions/ { return 302 /extensions/repo.json; }
    location /extensions/ {
        try_files $uri =404;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=60" always;
    }
    location / { return 404; }
}
