server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/senkai.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senkai.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name senkai.fun;
    root /var/www/senkai.fun/public;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/senkai.fun/acme;
        try_files $uri =404;
    }
    location = /extensions { return 302 /extensions/repo.json; }
    location = /extensions/ { return 302 /extensions/repo.json; }
    location /extensions/ {
        try_files $uri =404;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=60" always;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name senkai.fun;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/senkai.fun/acme;
        try_files $uri =404;
    }
    location / { return 301 https://senkai.fun$request_uri; }
}
