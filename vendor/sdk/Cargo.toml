[workspace]
resolver = "2"
members = ["crates/anm-sdk", "crates/anm-types", "crates/anm-manifest", "crates/anm-repository", "tools/anmx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AniMex"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
