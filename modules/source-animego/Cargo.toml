[package]
name = "anm-source-animego"
version = "0.1.6"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "anm_source_animego"

[dependencies]
anm-sdk = { path = "../../vendor/sdk/crates/anm-sdk" }
wit-bindgen = "0.63.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
# HTML parsing, same crate and features the tracker-jikan module uses.
dom_query = { version = "0.28", default-features = false }

# Keeps the module out of any parent cargo workspace, like source-anilibria.
[workspace]
