[package]
name = "anm-source-yummyani"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "anm_source_yummyani"

[dependencies]
anm-sdk = { path = "../../vendor/sdk/crates/anm-sdk" }
wit-bindgen = "0.63.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

# Keeps the module out of any parent cargo workspace, like source-animego.
[workspace]
