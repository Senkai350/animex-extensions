[package]
name = "anm-tracker-shikimori"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "anm_tracker_shikimori"

[dependencies]
anm-sdk = { path = "../../vendor/sdk/crates/anm-sdk" }
wit-bindgen = "0.63.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

dom_query = { version = "0.28", default-features = false }

[workspace]
